name: "Dockerize and push to Infra-Repo"
description: "Dockerize application and push Kubernetes-files to Infra-Repo"
author: "fantasyflip"

inputs:
  node-version:
    required: false
    default: "18"
    description: "Deprecated — no longer used. Kept for backward compatibility with existing workflows."
  infra-repo:
    required: true
    description: "Repository to push Kubernetes-files to"
  source-repo:
    default: ${{ github.repository }}
    required: false
    description: "Repository to pull application from"
  gh-token:
    required: true
    description: "GitHub Token for pushing and pulling to/from Infra-Repo"
  gh-username:
    required: false
    description: "GitHub Username for pushing and pulling to/from Infra-Repo"
    default: ${{ github.actor }}
  gh-email:
    required: true
    description: "GitHub Email for pushing and pulling to/from Infra-Repo"
  source-branch:
    default: "main"
    required: false
    description: "Branch to pull application from"
  infra-branch:
    default: "main"
    required: false
    description: "Branch to pull infra repository from"
  namespace:
    required: true
    description: "Namespace for Kubernetes-files"
  app-name:
    required: true
    description: "Name of the application for the Infra-Repo"
  deployment-path:
    default: "deployment"
    required: false
    description: "Path to the deployment files in the source repository"
  mode:
    default: "full"
    required: false
    description: >-
      full = build image and transfer manifests in one job.
      build = only build and push the image (run in parallel with tests).
      transfer = skip the build, verify the image exists, then transfer manifests (run after tests and the build job).
  cache-backend:
    default: "gha"
    required: false
    description: "BuildKit layer cache: gha (GitHub Actions cache), registry (ghcr.io/{repo}:buildcache) or none"
  cache-mode:
    default: "max"
    required: false
    description: "BuildKit cache export mode: max (all stages, needed to cache dependency installs) or min (final image only)"
  cache-mounts:
    default: "auto"
    required: false
    description: "Persist Dockerfile RUN --mount=type=cache directories (e.g. pnpm store) between runs: auto (when the Dockerfile uses them), true or false"

outputs:
  image-url:
    description: "Image reference that was built (build/full) or verified (transfer)"
    value: ${{ steps.image-url.outputs.image-url }}

runs:
  using: "composite"
  steps:
    - name: Validate inputs
      shell: bash
      run: |
        # Fail fast on typos instead of silently skipping steps
        case "${{ inputs.mode }}" in full|build|transfer) ;; *) echo "::error::mode must be full, build or transfer"; exit 1;; esac
        case "${{ inputs.cache-backend }}" in gha|registry|none) ;; *) echo "::error::cache-backend must be gha, registry or none"; exit 1;; esac
        case "${{ inputs.cache-mode }}" in max|min) ;; *) echo "::error::cache-mode must be max or min"; exit 1;; esac
        case "${{ inputs.cache-mounts }}" in auto|true|false) ;; *) echo "::error::cache-mounts must be auto, true or false"; exit 1;; esac

    # Sub-actions resolve from the job workspace, not the downloaded action
    # package — copy from GITHUB_ACTION_PATH (pinned consumer ref, no re-fetch).
    - name: Prepare sub-action files
      shell: bash
      run: |
        # Materialize sub-actions into the workspace (uses: ./actions/* resolves here)
        cp -r "${GITHUB_ACTION_PATH}/actions" ./actions
        cp "${GITHUB_ACTION_PATH}/utils.js" ./utils.js
        cp "${GITHUB_ACTION_PATH}/package.json" ./package.json
        cp "${GITHUB_ACTION_PATH}/package-lock.json" ./package-lock.json

    - name: Install action dependencies
      shell: bash
      run: npm ci --ignore-scripts

    - name: Checkout source repository
      if: inputs.source-repo
      uses: actions/checkout@v5
      with:
        repository: ${{ inputs.source-repo }}
        token: ${{ inputs.gh-token }}
        path: source
        ref: ${{ inputs.source-branch }}
        fetch-depth: 1

    - name: Checkout this repo as source
      if: ${{ !inputs.source-repo }}
      uses: actions/checkout@v5
      with:
        path: source
        ref: ${{ inputs.source-branch }}
        fetch-depth: 1

    - name: Checkout infra code
      if: inputs.mode != 'build'
      uses: actions/checkout@v5
      with:
        repository: ${{ inputs.infra-repo }}
        token: ${{ inputs.gh-token }}
        path: infra
        ref: ${{ inputs.infra-branch }}
        fetch-depth: 1

    - name: Generate Image URL
      id: image-url
      uses: ./actions/generateImageUrl/
      with:
        repo-name: ${{ inputs.source-repo }}
        branch-name: ${{ inputs.source-branch || 'main' }}
        sha: ${{ github.sha }}

    - name: Log in to GitHub Container Registry
      shell: bash
      run: echo "${{ inputs.gh-token }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

    # QEMU only runs the runtime stage's RUN steps; the Nuxt build itself should
    # use FROM --platform=$BUILDPLATFORM (see templates/Dockerfile.nuxt).
    - name: Set up QEMU
      if: inputs.mode != 'transfer' && runner.arch != 'ARM64'
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64

    - name: Set up Docker Buildx
      if: inputs.mode != 'transfer'
      uses: docker/setup-buildx-action@v3

    # type=gha needs ACTIONS_RUNTIME_TOKEN / cache URLs, which run: steps don't get by default
    - name: Expose GitHub runtime for BuildKit cache
      if: inputs.mode != 'transfer' && inputs.cache-backend == 'gha'
      uses: crazy-max/ghaction-github-runtime@v4

    - name: Detect Dockerfile cache mounts
      if: inputs.mode != 'transfer'
      shell: bash
      run: |
        # auto: only persist cache mounts when the Dockerfile actually declares some
        CACHE_MOUNTS="${{ inputs.cache-mounts }}"
        if [ "${CACHE_MOUNTS}" = "auto" ]; then
          if grep -Eq -- '--mount=type=cache' source/Dockerfile; then CACHE_MOUNTS=true; else CACHE_MOUNTS=false; fi
        fi
        echo "Persist cache mounts: ${CACHE_MOUNTS}"
        echo "RT_CACHE_MOUNTS=${CACHE_MOUNTS}" >> $GITHUB_ENV

    - name: Restore cache mounts
      id: cache-mounts
      if: inputs.mode != 'transfer' && env.RT_CACHE_MOUNTS == 'true'
      uses: actions/cache@v4
      with:
        path: buildkit-cache-mounts
        key: buildkit-mounts-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('source/Dockerfile', 'source/**/pnpm-lock.yaml', 'source/**/package-lock.json', 'source/**/yarn.lock') }}
        restore-keys: |
          buildkit-mounts-${{ runner.os }}-${{ runner.arch }}-

    # Post step extracts the mounts after the build; skipped on an exact cache hit (nothing new to save)
    - name: Inject cache mounts into BuildKit
      if: inputs.mode != 'transfer' && env.RT_CACHE_MOUNTS == 'true'
      uses: reproducible-containers/buildkit-cache-dance@v3.4.0
      with:
        dockerfile: source/Dockerfile
        cache-dir: buildkit-cache-mounts
        skip-extraction: ${{ steps.cache-mounts.outputs.cache-hit }}

    - name: Build Docker image
      if: inputs.mode != 'transfer'
      shell: bash
      run: |
        CACHE_ARGS=()
        case "${{ inputs.cache-backend }}" in
          gha)
            CACHE_ARGS=(--cache-from type=gha --cache-to "type=gha,mode=${{ inputs.cache-mode }},ignore-error=true")
            ;;
          registry)
            CACHE_REF="ghcr.io/${SOURCE_REPO,,}:buildcache"
            CACHE_ARGS=(--cache-from "type=registry,ref=${CACHE_REF}" --cache-to "type=registry,ref=${CACHE_REF},mode=${{ inputs.cache-mode }},image-manifest=true,oci-mediatypes=true,ignore-error=true")
            ;;
        esac

        build() {
          docker buildx build \
            --file source/Dockerfile \
            --push \
            --platform linux/arm64 \
            --tag "${RT_IMG_URL}" \
            "${CACHE_ARGS[@]}" \
            source
        }

        if [ "${{ inputs.mode }}" = "full" ]; then
          # Build in the background so ingress work runs in parallel. Each step is a
          # separate shell, so `wait` can't be used later — record the exit code instead.
          rm -f "${RUNNER_TEMP}/docker-build.exit"
          ( build; echo $? > "${RUNNER_TEMP}/docker-build.exit" ) > "${RUNNER_TEMP}/docker-build.log" 2>&1 &
          echo "Docker build started in background"
        else
          build
        fi
      env:
        SOURCE_REPO: ${{ inputs.source-repo }}

    - name: Verify image exists
      if: inputs.mode == 'transfer'
      shell: bash
      run: |
        # Transfer mode trusts a separate build job — make sure it actually pushed this tag
        if ! docker buildx imagetools inspect "${RT_IMG_URL}" > /dev/null; then
          echo "::error::Image ${RT_IMG_URL} not found. Run this action with mode: build for the same commit first."
          exit 1
        fi
        echo "Found ${RT_IMG_URL}"

    - name: Check ingress in infra repo
      if: inputs.mode != 'build'
      uses: ./actions/checkIngress/
      with:
        namespace: ${{ inputs.namespace }}
        deployment-path: ${{ inputs.deployment-path }}

    - name: Check if Ingress files are identical
      if: inputs.mode != 'build' && env.RT_INGRESS_EXISTS == 'true'
      uses: ./actions/checkIngressDiff/
      with:
        namespace: ${{ inputs.namespace }}
        deployment-path: ${{ inputs.deployment-path }}

    - name: Merge Ingress ruleset
      if: inputs.mode != 'build' && env.RT_INGRESS_EXISTS == 'true' && env.RT_INGRESS_IDENTICAL == 'false'
      uses: ./actions/mergeIngress/
      with:
        namespace: ${{ inputs.namespace }}
        deployment-path: ${{ inputs.deployment-path }}

    - name: Check if ingress changes were made
      if: inputs.mode != 'build' && env.RT_INGRESS_EXISTS == 'true' && env.RT_INGRESS_IDENTICAL == 'false'
      shell: bash
      run: |
        # Track whether mergeIngress produced a diff worth committing
        if git diff --quiet namespace/${{ inputs.namespace }}/ingress.json; then
          echo "No changes made to ingress.json"
          echo "RT_CHANGES_MADE=false" >> $GITHUB_ENV
        else
          echo "Changes made to ingress.json"
          echo "RT_CHANGES_MADE=true" >> $GITHUB_ENV
        fi
      working-directory: infra

    - name: Generate ingress commit message
      if: inputs.mode != 'build' && (env.RT_CHANGES_MADE == 'true' || env.RT_INGRESS_EXISTS == 'false')
      uses: ./actions/generateCommitMessage/
      with:
        repo-name: ${{ inputs.source-repo }}
        namespace: ${{ inputs.namespace }}
        app-name: ${{ inputs.app-name }}

    - name: Wait for Docker build
      if: inputs.mode == 'full'
      shell: bash
      run: |
        # Block until the background build writes its exit code
        while [ ! -f "${RUNNER_TEMP}/docker-build.exit" ]; do sleep 2; done
        EXIT_CODE="$(cat "${RUNNER_TEMP}/docker-build.exit")"

        echo "::group::Docker build log"
        cat "${RUNNER_TEMP}/docker-build.log"
        echo "::endgroup::"

        if [ "${EXIT_CODE}" = "0" ]; then
          echo "Docker build succeeded"
        else
          echo "::error::Docker build failed (exit ${EXIT_CODE})"
          tail -n 200 "${RUNNER_TEMP}/docker-build.log"
          exit 1
        fi

    - name: Update k8s deployment image
      if: inputs.mode != 'build'
      uses: ./actions/updateImageUrl/
      with:
        image-url: ${{ env.RT_IMG_URL }}
        deployment-file: source/${{ inputs.deployment-path }}/pod/deployment.json

    - name: Copy pod manifests and push infra changes
      if: inputs.mode != 'build'
      shell: bash
      run: |
        POD_DEST="namespace/${{ inputs.namespace }}/${{ inputs.app-name }}"
        INGRESS_PATH="namespace/${{ inputs.namespace }}/ingress.json"

        # Copy pod manifests into the already-checked-out infra tree
        mkdir -p "infra/${POD_DEST}"
        cp -a "source/${{ inputs.deployment-path }}/pod/." "infra/${POD_DEST}/"

        cd infra
        git config user.name "${{ inputs.gh-username }}"
        git config user.email "${{ inputs.gh-email }}"

        git add "${POD_DEST}"

        # Stage ingress when it was newly added or merged
        if [ "${RT_INGRESS_EXISTS}" = "false" ] || [ "${RT_CHANGES_MADE}" = "true" ]; then
          git add "${INGRESS_PATH}"
        fi

        # Skip push when pod and ingress are both unchanged
        if git diff --staged --quiet; then
          echo "No infra changes to commit"
          exit 0
        fi

        # Prefer ingress commit message when ingress changed; otherwise pod-only message
        if { [ "${RT_INGRESS_EXISTS}" = "false" ] || [ "${RT_CHANGES_MADE}" = "true" ]; } && [ -n "${RT_COM_MSG}" ]; then
          COMMIT_MSG="${RT_COM_MSG}"
        else
          COMMIT_MSG="chore(k8s): Copy pod ${{ inputs.app-name }} from ${{ inputs.source-repo }} to namespace ${{ inputs.namespace }} [CI][N=${{ inputs.namespace }}]"
        fi

        git commit -m "${COMMIT_MSG}"
        git push origin "${{ inputs.infra-branch }}"
      env:
        GITHUB_TOKEN: ${{ inputs.gh-token }}
        RT_INGRESS_EXISTS: ${{ env.RT_INGRESS_EXISTS }}
        RT_CHANGES_MADE: ${{ env.RT_CHANGES_MADE }}
        RT_COM_MSG: ${{ env.RT_COM_MSG }}

    - name: Commit and push deployment changes to source repository
      if: inputs.mode != 'build'
      shell: bash
      run: |
        cd source
        git config user.email "${{ inputs.gh-email }}"
        git config user.name "${{ inputs.gh-username }}"
        git add ${{ inputs.deployment-path }}/pod/deployment.json
        if git diff-index --quiet HEAD; then
          echo "Warning: No changes to commit"
        else
          git commit -m "chore(k8s): update deployment info [skip ci]"
          git push
        fi
      env:
        GITHUB_TOKEN: ${{ inputs.gh-token }}
